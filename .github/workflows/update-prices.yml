name: Update Unit Trust Prices

on:
  schedule:
    # 13:30 UTC = 19:00 Sri Lanka time.
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wealthfolio-unit-trust-price-feed
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python requirements
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Run offline parser and data-integrity tests
        run: python -m unittest discover -s tests -v

      - name: Collect and validate unit trust prices
        id: scrape
        shell: bash
        run: |
          set +e
          python scripts/update_prices.py
          script_status=$?
          echo "exit_code=${script_status}" >> "${GITHUB_OUTPUT}"
          # Keep going so last-known-good CSVs and the status page can still deploy.
          exit 0

      - name: Commit changed files in docs
        id: commit_docs
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes in docs; no commit needed."
          else
            git commit -m "Update unit trust price data"
            commit_status=$?
            if [ "${commit_status}" -eq 0 ]; then
              git push
              commit_status=$?
            fi
          fi
          echo "exit_code=${commit_status:-0}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Configure GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && steps.scrape.outcome == 'success'
        id: configure_pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main' && steps.scrape.outcome == 'success' && steps.configure_pages.outcome == 'success'
        id: upload_pages
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: docs/

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && steps.scrape.outcome == 'success' && steps.configure_pages.outcome == 'success' && steps.upload_pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Report docs commit failures
        if: steps.commit_docs.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "The price data was deployed, but committing the updated docs to main failed."
          echo "Review the Commit changed files in docs step above."
          exit 1

      - name: Report collection failures
        if: steps.scrape.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "One or more fund updates failed. The last-known-good files were retained and deployed where available."
          echo "Review the Collect and validate unit trust prices step above."
          exit 1
